version: '3.8'

services:
  system-cleaner:
    image: docker:cli
    environment:
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "echo '0 0 * * * docker container prune -f && docker image prune -f' > /etc/crontabs/root && crond -f -d 8"
    deploy:
      mode: global
      resources:
        limits:
          memory: 50M
      restart_policy:
        condition: any

